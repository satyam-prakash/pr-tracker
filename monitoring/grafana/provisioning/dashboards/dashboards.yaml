apiVersion: 1

providers:
  - name: "PR Tracker Dashboards"
    orgId: 1
    folder: "PR Tracker"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # This path matches the volume mount in docker-compose.monitoring.yml:
      # ./monitoring/grafana/dashboards → /etc/grafana/dashboards
      path: /etc/grafana/dashboards
