global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: "pr-tracker"
    env: "production"

# Load alert rules
rule_files:
  - "/etc/prometheus/alerts/github-api.yml"
  - "/etc/prometheus/alerts/ai-service.yml"

scrape_configs:

  - job_name: "gateway"
    static_configs:
      - targets: ["service-router:5003"]
    metrics_path: /metrics

  - job_name: "auth-service"
    static_configs:
      - targets: ["auth-service:5005"]
    metrics_path: /metrics

  - job_name: "main-backend"
    static_configs:
      - targets: ["main-backend:5002"]
    metrics_path: /metrics

  - job_name: "ai-agent"
    static_configs:
      - targets: ["ai-agent:5001"]
    metrics_path: /metrics

  - job_name: "mongodb-service"
    static_configs:
      - targets: ["mongodb-service:5004"]
    metrics_path: /metrics

  - job_name: "prometheus-self"
    static_configs:
      - targets: ["localhost:9090"]
