server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Load security headers (defined in separate file)
    include /etc/nginx/security-headers.conf;

    # SPA fallback — React Router direct URL visits
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache hashed static assets forever (Vite content hashes)
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|ico|png|jpg|webp|avif|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Never cache the HTML entry point
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Health probe (used by ALB / k8s readiness)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Gzip compression
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml;
}
