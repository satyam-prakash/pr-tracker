# ============================================================
# Security Headers — included by nginx.conf
# ============================================================

# Prevent clickjacking
add_header X-Frame-Options "DENY" always;

# Prevent MIME-type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Enable XSS filter for older browsers
add_header X-XSS-Protection "1; mode=block" always;

# Control how much referrer info is sent
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions Policy — disable features we don't use
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Content Security Policy — adjust 'connect-src' to your API domain in prod
add_header Content-Security-Policy "
  default-src 'self';
  script-src  'self' 'unsafe-inline';
  style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src    'self' https://fonts.gstatic.com;
  img-src     'self' data: https:;
  connect-src 'self' https://api.prtracker.dev wss://api.prtracker.dev;
  frame-ancestors 'none';
" always;

# HTTP Strict Transport Security (only meaningful behind HTTPS terminator)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
