server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — React Router needs this so direct URL visits work
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets forever (Vite adds content hashes to filenames)
    location ~* \.(js|css|png|jpg|svg|ico|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the HTML entry point
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
