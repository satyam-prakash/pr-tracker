# ============================================================
# CI/CD — Unified Pipeline
# Triggers on PRs (lint + build) and main pushes (build + deploy).
# ============================================================

name: "CI/CD — All Services"

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ── 1. Lint & unit test ──────────────────────────────────────────
  lint-and-test:
    name: Lint & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - pr-tracker-client
          - pr-tracker-service-router
          - pr-tracker-main-backend
          - pr-tracker-backend
          - pr-tracker-ai-agent
          - pr-tracker-mongodb
          - pr-tracker-poller

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.service }}
        run: npm run lint --if-present
        continue-on-error: true

      - name: Test
        working-directory: ${{ matrix.service }}
        run: npm test --if-present
        continue-on-error: true

  # ── 2. Docker build validation (PR only) ────────────────────────
  docker-validate:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: pr-tracker-client
            target: production
          - service: pr-tracker-service-router
            target: production
          - service: pr-tracker-main-backend
            target: production
          - service: pr-tracker-backend
            target: production
          - service: pr-tracker-ai-agent
            target: production
          - service: pr-tracker-mongodb
            target: production
          - service: pr-tracker-poller
            target: production

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate Docker build
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: false
          target: ${{ matrix.target }}
          # PR validation: use localhost placeholder for the client build-arg.
          # No secret needed here — just validates the Dockerfile compiles.
          build-args: |
            ${{ matrix.service == 'pr-tracker-client' && 'VITE_SERVER_ENDPOINT=http://localhost' || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ── 3. Build & push images (main only) ──────────────────────────
  build-and-push:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: pr-tracker-client
            image_suffix: client
            target: production
          - service: pr-tracker-service-router
            image_suffix: gateway
            target: production
          - service: pr-tracker-main-backend
            image_suffix: main-backend
            target: production
          - service: pr-tracker-backend
            image_suffix: auth
            target: production
          - service: pr-tracker-ai-agent
            image_suffix: ai-agent
            target: production
          - service: pr-tracker-mongodb
            image_suffix: mongodb-service
            target: production
          - service: pr-tracker-poller
            image_suffix: poller
            target: production

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/pr-tracker-${{ matrix.image_suffix }}
          tags: |
            type=sha,prefix=main-
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          target: ${{ matrix.target }}
          # secrets.* is only valid at step level, not in strategy.matrix.
          # Only the client needs a build-arg; all other services skip this.
          build-args: |
            ${{ matrix.service == 'pr-tracker-client' && format('VITE_SERVER_ENDPOINT={0}', secrets.CLIENT_URL) || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ── 4. Deploy to EC2 ────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/pr-tracker

            # Authenticate to GHCR so private images can be pulled
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              --username ${{ github.actor }} \
              --password-stdin

            # Pull all new images in parallel
            docker compose pull

            # Restart all services with new images, remove orphaned containers
            docker compose up -d --remove-orphans

            # Remove dangling images to save disk space
            docker image prune -f

            # Print final health summary
            echo "=== Deploy complete: $(date) ==="
            docker compose ps

