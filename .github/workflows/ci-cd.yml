# ============================================================
# CI/CD — Unified Pipeline
# Triggers on PRs (lint + build) and main pushes (build + deploy).
#
# Strategy:
#   - Docker Compose  → local dev & testing  (docker-compose.yml)
#   - Kubernetes      → production deployment (k8s/*.yml)
# ============================================================

name: "CI/CD — All Services"

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ── 1. Lint & unit test ──────────────────────────────────────────
  lint-and-test:
    name: Lint & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - pr-tracker-client
          - pr-tracker-service-router
          - pr-tracker-main-backend
          - pr-tracker-backend
          - pr-tracker-ai-agent
          - pr-tracker-mongodb
          - pr-tracker-poller

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.service }}
        run: npm run lint --if-present
        continue-on-error: true

      - name: Test
        working-directory: ${{ matrix.service }}
        run: npm test --if-present
        continue-on-error: true

  # ── 2. Docker build validation (PR only) ────────────────────────
  docker-validate:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: pr-tracker-client
            target: production
          - service: pr-tracker-service-router
            target: production
          - service: pr-tracker-main-backend
            target: production
          - service: pr-tracker-backend
            target: production
          - service: pr-tracker-ai-agent
            target: production
          - service: pr-tracker-mongodb
            target: production
          - service: pr-tracker-poller
            target: production

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate Docker build
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: false
          target: ${{ matrix.target }}
          build-args: |
            ${{ matrix.service == 'pr-tracker-client' && 'VITE_SERVER_ENDPOINT=http://localhost' || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ── 3. Build & push images (main only) ──────────────────────────
  build-and-push:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: pr-tracker-client
            image_suffix: client
            target: production
          - service: pr-tracker-service-router
            image_suffix: gateway
            target: production
          - service: pr-tracker-main-backend
            image_suffix: main-backend
            target: production
          - service: pr-tracker-backend
            image_suffix: auth
            target: production
          - service: pr-tracker-ai-agent
            image_suffix: ai-agent
            target: production
          - service: pr-tracker-mongodb
            image_suffix: mongodb-service
            target: production
          - service: pr-tracker-poller
            image_suffix: poller
            target: production

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/pr-tracker-${{ matrix.image_suffix }}
          tags: |
            type=sha,prefix=main-
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          target: ${{ matrix.target }}
          build-args: |
            ${{ matrix.service == 'pr-tracker-client' && format('VITE_SERVER_ENDPOINT={0}', secrets.CLIENT_URL) || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ── 4. Deploy to Kubernetes ──────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes (EKS/K3s)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      # ── Step 4a: Write kubeconfig from GitHub Secret ─────────────
      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      # ── Step 4b: Apply namespace + secrets ───────────────────────
      - name: Apply namespace
        run: kubectl apply -f k8s/namespace.yml

      - name: Apply secrets
        run: |
          kubectl create secret generic pr-tracker-secrets \
            --namespace=pr-tracker \
            --from-literal=MONGO_URI="${{ secrets.MONGO_URI }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=ENCRYPTION_SECRET="${{ secrets.ENCRYPTION_SECRET }}" \
            --from-literal=GITHUB_CLIENT_ID="${{ secrets.GITHUB_CLIENT_ID }}" \
            --from-literal=GITHUB_CLIENT_SECRET="${{ secrets.GITHUB_CLIENT_SECRET }}" \
            --from-literal=GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            --from-literal=GITHUB_WEBHOOK_SECRET="${{ secrets.GITHUB_WEBHOOK_SECRET }}" \
            --from-literal=MISTRAL_API_KEY="${{ secrets.MISTRAL_API_KEY }}" \
            --from-literal=POLLER_SECRET="${{ secrets.POLLER_SECRET }}" \
            --from-literal=GRAFANA_PASSWORD="${{ secrets.GRAFANA_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      # ── Step 4c: Apply all K8s manifests ─────────────────────────
      - name: Apply K8s manifests
        run: kubectl apply -f k8s/

      # ── Step 4d: Force rolling update (pull latest images) ───────
      # K8s won't re-pull :latest unless we force a rollout restart.
      - name: Rollout restart all deployments
        run: |
          kubectl rollout restart deployment/client           -n pr-tracker
          kubectl rollout restart deployment/service-router   -n pr-tracker
          kubectl rollout restart deployment/auth-service     -n pr-tracker
          kubectl rollout restart deployment/main-backend     -n pr-tracker
          kubectl rollout restart deployment/ai-agent         -n pr-tracker
          kubectl rollout restart deployment/mongodb-service  -n pr-tracker

      # ── Step 4e: Wait for rollouts to complete ───────────────────
      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/client           -n pr-tracker --timeout=120s
          kubectl rollout status deployment/service-router   -n pr-tracker --timeout=120s
          kubectl rollout status deployment/auth-service     -n pr-tracker --timeout=120s
          kubectl rollout status deployment/main-backend     -n pr-tracker --timeout=120s
          kubectl rollout status deployment/ai-agent         -n pr-tracker --timeout=120s
          kubectl rollout status deployment/mongodb-service  -n pr-tracker --timeout=120s

      # ── Step 4f: Verify deployment ───────────────────────────────
      - name: Show pod status
        if: always()
        run: |
          echo "=== Pods ==="
          kubectl get pods -n pr-tracker
          echo "=== Services ==="
          kubectl get svc -n pr-tracker
          echo "=== Deploy complete: $(date) ==="
