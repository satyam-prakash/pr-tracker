# ============================================================
# AUTH SERVICE — Independent CI/CD Pipeline
# Triggers ONLY when pr-tracker-backend/** files change
# ============================================================

name: "Auth — CI/CD"

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "pr-tracker-backend/**"
      - ".github/workflows/auth.yml"

  push:
    branches: [main]
    paths:
      - "pr-tracker-backend/**"
      - ".github/workflows/auth.yml"

env:
  SERVICE_DIR: pr-tracker-backend
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/pr-tracker-auth

jobs:
  ci:
    name: CI — Lint & Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ env.SERVICE_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.SERVICE_DIR }}
        run: npm ci

      - name: Lint
        working-directory: ${{ env.SERVICE_DIR }}
        run: npm run lint --if-present

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for scan
        run: docker build -t auth-scan ./${{ env.SERVICE_DIR }} --target production

      - name: Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: auth-scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  cd:
    name: CD — Push & Deploy
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=main-
            type=raw,value=latest

      - name: Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ env.SERVICE_DIR }}
          push: true
          target: production
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=auth
          cache-to: type=gha,mode=max,scope=auth

      - name: Deploy auth service only
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/pr-tracker
            bash deploy/deploy-auth.sh
