# ============================================================
# CLIENT — Independent CI/CD Pipeline
# ============================================================

name: "Client — CI/CD"

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "pr-tracker-client/**"
      - ".github/workflows/client.yml"
  push:
    branches: [main]
    paths:
      - "pr-tracker-client/**"
      - ".github/workflows/client.yml"

env:
  SERVICE_DIR: pr-tracker-client
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/pr-tracker-client

jobs:
  ci:
    name: CI — Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ env.SERVICE_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.SERVICE_DIR }}
        run: npm ci

      - name: Lint
        working-directory: ${{ env.SERVICE_DIR }}
        run: npm run lint --if-present
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker build
        uses: docker/build-push-action@v5
        continue-on-error: true
        with:
          context: ./${{ env.SERVICE_DIR }}
          push: false
          target: production
          build-args: VITE_SERVER_ENDPOINT=http://localhost
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

  cd:
    name: CD — Push & Deploy
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=main-
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ env.SERVICE_DIR }}
          push: true
          target: production
          build-args: VITE_SERVER_ENDPOINT=${{ secrets.CLIENT_URL || 'http://localhost' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

      - name: Deploy to EC2
        if: ${{ secrets.VPS_HOST != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/pr-tracker
            bash deploy/deploy-client.sh
