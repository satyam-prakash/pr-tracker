# ============================================================
# GATEWAY (service-router) — Independent CI/CD Pipeline
# Triggers ONLY when pr-tracker-service-router/** files change
# ============================================================

name: "Gateway — CI/CD"

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "pr-tracker-service-router/**"
      - ".github/workflows/gateway.yml"

  push:
    branches: [main]
    paths:
      - "pr-tracker-service-router/**"
      - ".github/workflows/gateway.yml"

env:
  SERVICE_DIR: pr-tracker-service-router
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/pr-tracker-gateway

jobs:
  ci:
    name: CI — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ env.SERVICE_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.SERVICE_DIR }}
        run: npm ci

      - name: Lint
        working-directory: ${{ env.SERVICE_DIR }}
        run: npm run lint --if-present

      - name: Validate Docker build
        uses: docker/build-push-action@v5
        with:
          context: ./${{ env.SERVICE_DIR }}
          push: false
          target: production
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

  cd:
    name: CD — Push & Deploy
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=main-
            type=raw,value=latest

      - name: Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ env.SERVICE_DIR }}
          push: true
          target: production
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      - name: Deploy gateway only
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/pr-tracker
            bash deploy/deploy-gateway.sh
