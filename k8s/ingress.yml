# ============================================================
# Nginx Ingress — Routes external traffic to services
# Requires: ingress-nginx controller installed in cluster
# ============================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pr-tracker-ingress
  namespace: pr-tracker
  annotations:
    # Automatic SSL via cert-manager + Let's Encrypt
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Rate limiting via Nginx ingress controller
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway-svc
                port:
                  number: 5003
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client-svc
                port:
                  number: 80
