# ============================================================
# MongoDB Data Service — Deployment + Service
# NOTE: This is the Node.js data-access microservice,
#       NOT a MongoDB database pod (DB is Atlas cloud-hosted).
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-service
  namespace: pr-tracker
  labels:
    app: mongodb-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mongodb-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: mongodb-service
    spec:
      containers:
        - name: mongodb-service
          image: ghcr.io/satyam-prakash/pr-tracker-mongodb-service:latest
          ports:
            - containerPort: 5004
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "5004"
            - name: MONGODB_URI
              value: "mongodb+srv://satyampr56_db_user:7cs2q2Xvvp4cmDRg@cluster0.ulgcsaw.mongodb.net/?appName=Cluster0"
            - name: CLIENT_URL
              value: "http://13.235.8.241"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5004
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5004
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-svc
  namespace: pr-tracker
spec:
  selector:
    app: mongodb-service
  ports:
    - port: 5004
      targetPort: 5004
  type: ClusterIP
