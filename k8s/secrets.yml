# ============================================================
# Kubernetes Secrets — PR Tracker
# IMPORTANT: Do NOT commit this file with real values to git.
# In CI/CD, values are injected via GitHub Secrets at deploy time.
# Generate base64: echo -n "value" | base64
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: pr-tracker-secrets
  namespace: pr-tracker
type: Opaque
stringData:
  # stringData accepts plain text — K8s encodes to base64 automatically
  MONGO_URI: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME"
  ENCRYPTION_SECRET: "REPLACE_ME"
  GITHUB_CLIENT_ID: "REPLACE_ME"
  GITHUB_CLIENT_SECRET: "REPLACE_ME"
  GITHUB_TOKEN: "REPLACE_ME"
  GITHUB_WEBHOOK_SECRET: "REPLACE_ME"
  MISTRAL_API_KEY: "REPLACE_ME"
  POLLER_SECRET: "REPLACE_ME"
  GRAFANA_PASSWORD: "REPLACE_ME"
