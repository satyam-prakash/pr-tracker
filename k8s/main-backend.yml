# ============================================================
# Main Backend — Deployment + Service + HPA
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-backend
  namespace: pr-tracker
  labels:
    app: main-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: main-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # Spin up 1 new pod before terminating old one
      maxUnavailable: 0  # Zero downtime — never terminate before new pod is Ready
  template:
    metadata:
      labels:
        app: main-backend
    spec:
      containers:
        - name: main-backend
          # Replace with your actual GHCR image + SHA tag
          image: ghcr.io/your-github-username/pr-tracker-main-backend:latest
          ports:
            - containerPort: 5002
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "5002"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pr-tracker-secrets
                  key: JWT_SECRET
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pr-tracker-secrets
                  key: GITHUB_TOKEN
            - name: ENCRYPTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: pr-tracker-secrets
                  key: ENCRYPTION_SECRET
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: pr-tracker-secrets
                  key: GITHUB_WEBHOOK_SECRET
            - name: PROXY_URL
              value: "http://gateway-svc:5000"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5002
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5002
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: main-backend-svc
  namespace: pr-tracker
spec:
  selector:
    app: main-backend
  ports:
    - port: 5002
      targetPort: 5002
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: main-backend-hpa
  namespace: pr-tracker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: main-backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
