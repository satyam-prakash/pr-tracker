# ============================================================
# PR Poller — Kubernetes CronJob
# Runs every hour to sync all tracked repositories.
# ============================================================

apiVersion: batch/v1
kind: CronJob
metadata:
  name: pr-poller
  namespace: pr-tracker
  labels:
    app: pr-poller
spec:
  # Run at the top of every hour
  schedule: "0 * * * *"

  # Keep last 3 successful and 1 failed job log
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

  # If last job is still running when this fires, skip this run
  concurrencyPolicy: Forbid

  jobTemplate:
    spec:
      # Retry up to 3 times on failure
      backoffLimit: 3

      # Kill job if it runs longer than 10 minutes (GitHub API timeout protection)
      activeDeadlineSeconds: 600

      template:
        metadata:
          labels:
            app: pr-poller
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pr-poller
              image: ghcr.io/satyam-prakash/pr-tracker-poller:latest
              env:
                - name: NODE_ENV
                  value: production
                - name: POLL_INTERVAL_MS
                  value: "0"       # Single-run mode — CronJob controls schedule
                - name: CORE_SERVICE_URL
                  value: "http://main-backend-svc:5002"
                - name: POLLER_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: pr-tracker-secrets
                      key: POLLER_SECRET
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "128Mi"
                  cpu: "200m"
