# ============================================================
# Auth Service — Deployment + Service
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: pr-tracker
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/satyam-prakash/pr-tracker-auth:latest
          ports:
            - containerPort: 5005
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "5005"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: pr-tracker-secrets
                  key: MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pr-tracker-secrets
                  key: JWT_SECRET
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: pr-tracker-secrets
                  key: GITHUB_CLIENT_ID
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pr-tracker-secrets
                  key: GITHUB_CLIENT_SECRET
            - name: ENCRYPTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: pr-tracker-secrets
                  key: ENCRYPTION_SECRET
            - name: CLIENT_URL
              value: "http://13.207.3.18"
            - name: PROXY_URL
              value: "http://gateway-svc:5003"
            - name: GATEWAY_URL
              value: "http://13.207.3.18"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5005
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5005
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: auth-svc
  namespace: pr-tracker
spec:
  selector:
    app: auth-service
  ports:
    - port: 5005
      targetPort: 5005
  type: ClusterIP

---
# ============================================================
# AI Agent — Deployment + Service + HPA
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent
  namespace: pr-tracker
  labels:
    app: ai-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ai-agent
    spec:
      containers:
        - name: ai-agent
          image: ghcr.io/satyam-prakash/pr-tracker-ai-agent:latest
          ports:
            - containerPort: 5001
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "5001"
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pr-tracker-secrets
                  key: MISTRAL_API_KEY
            - name: PROXY_URL
              value: "http://gateway-svc:5003"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"   # AI calls can be memory intensive
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent-svc
  namespace: pr-tracker
spec:
  selector:
    app: ai-agent
  ports:
    - port: 5001
      targetPort: 5001
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-agent-hpa
  namespace: pr-tracker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-agent
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
