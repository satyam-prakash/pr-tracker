# ============================================================
# React Client — Deployment + Service
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: pr-tracker
  labels:
    app: client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: client
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: ghcr.io/satyam-prakash/pr-tracker-client:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: client-svc
  namespace: pr-tracker
spec:
  selector:
    app: client
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP

---
# ============================================================
# API Gateway (service-router) — Deployment + Service + HPA
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-router
  namespace: pr-tracker
  labels:
    app: service-router
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-router
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: service-router
    spec:
      containers:
        - name: service-router
          image: ghcr.io/satyam-prakash/pr-tracker-gateway:latest
          ports:
            - containerPort: 5003
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "5003"
            - name: AUTH_SERVICE_URL
              value: "http://auth-svc:5005"
            - name: CORE_SERVICE_URL
              value: "http://main-backend-svc:5002"
            - name: AI_SERVICE_URL
              value: "http://ai-agent-svc:5001"
            - name: DB_SERVICE_URL
              value: "http://mongodb-svc:5004"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pr-tracker-secrets
                  key: JWT_SECRET
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: pr-tracker-secrets
                  key: GITHUB_WEBHOOK_SECRET
            - name: CLIENT_URL
              value: "https://pr-tracker.yourdomain.com"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-svc
  namespace: pr-tracker
spec:
  selector:
    app: service-router
  ports:
    - port: 5003
      targetPort: 5003
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
  namespace: pr-tracker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: service-router
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
