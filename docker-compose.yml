# ============================================================
# PR Tracker — Full Stack Docker Compose
# All 8 services: nginx + client + gateway + auth + main + ai + mongodb-svc + poller
#
# On EC2:  image: fields are used (pull from GHCR)
# Locally: build: fields are used (build from source)
# ============================================================

networks:
  app-internal:
    driver: bridge

services:

  # ── NGINX REVERSE PROXY ─────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: pr-tracker-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - service-router
    networks:
      - app-internal
    restart: unless-stopped

  # ── REACT FRONTEND ──────────────────────────────────────────────
  client:
    image: ghcr.io/satyam-prakash/pr-tracker-client:latest
    build:
      context: ./pr-tracker-client
      dockerfile: Dockerfile
      target: production
      args:
        VITE_SERVER_ENDPOINT: ${VITE_SERVER_ENDPOINT:-http://localhost}
    container_name: pr-tracker-client
    networks:
      - app-internal
    restart: unless-stopped

  # ── API GATEWAY (port 5003) ──────────────────────────────────────
  service-router:
    image: ghcr.io/satyam-prakash/pr-tracker-gateway:latest
    build:
      context: ./pr-tracker-service-router
      dockerfile: Dockerfile
      target: production
    container_name: pr-tracker-gateway
    environment:
      - NODE_ENV=production
      - PORT=5003
      - AUTH_SERVICE_URL=http://auth-service:5005
      - CORE_SERVICE_URL=http://main-backend:5002
      - AI_SERVICE_URL=http://ai-agent:5001
      - DB_SERVICE_URL=http://mongodb-service:5004
      - CLIENT_URL=${CLIENT_URL}
      - JWT_SECRET=${JWT_SECRET}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
    networks:
      - app-internal
    depends_on:
      - auth-service
      - main-backend
      - ai-agent
      - mongodb-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5003/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── AUTH SERVICE (port 5005) ────────────────────────────────────
  auth-service:
    image: ghcr.io/satyam-prakash/pr-tracker-auth:latest
    build:
      context: ./pr-tracker-backend
      dockerfile: Dockerfile
      target: production
    container_name: pr-tracker-auth
    environment:
      - NODE_ENV=production
      - PORT=5005
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET}
      - CLIENT_URL=${CLIENT_URL}
      - GATEWAY_URL=http://service-router:5003
      - PROXY_URL=http://service-router:5003
    networks:
      - app-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5005/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── MAIN BACKEND (port 5002) ────────────────────────────────────
  main-backend:
    image: ghcr.io/satyam-prakash/pr-tracker-main-backend:latest
    build:
      context: ./pr-tracker-main-backend
      dockerfile: Dockerfile
      target: production
    container_name: pr-tracker-main
    environment:
      - NODE_ENV=production
      - PORT=5002
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET}
      - PROXY_URL=http://service-router:5003
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - WEBHOOK_URL=${WEBHOOK_URL}
    networks:
      - app-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5002/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── AI AGENT (port 5001) ────────────────────────────────────────
  ai-agent:
    image: ghcr.io/satyam-prakash/pr-tracker-ai-agent:latest
    build:
      context: ./pr-tracker-ai-agent
      dockerfile: Dockerfile
      target: production
    container_name: pr-tracker-ai
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - PROXY_URL=http://service-router:5003
    networks:
      - app-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── MONGODB DATA SERVICE (port 5004) ────────────────────────────
  mongodb-service:
    image: ghcr.io/satyam-prakash/pr-tracker-mongodb-service:latest
    build:
      context: ./pr-tracker-mongodb
      dockerfile: Dockerfile
      target: production
    container_name: pr-tracker-mongodb
    environment:
      - NODE_ENV=production
      - PORT=5004
      - MONGODB_URI=${MONGO_URI}
      - CLIENT_URL=${CLIENT_URL}
    networks:
      - app-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5004/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── POLLER WORKER ────────────────────────────────────────────────
  # In Docker Compose (local/EC2): runs continuously every hour.
  # In Kubernetes production: replaced by the pr-poller-cronjob.yaml CronJob.
  poller:
    image: ghcr.io/satyam-prakash/pr-tracker-poller:latest
    build:
      context: ./pr-tracker-poller
      dockerfile: Dockerfile
      target: production
    container_name: pr-tracker-poller
    environment:
      - NODE_ENV=production
      - CORE_SERVICE_URL=http://main-backend:5002
      - POLLER_SECRET=${POLLER_SECRET}
      - POLL_INTERVAL_MS=3600000   # 1 hour; set to 0 for single-run (k8s mode)
    networks:
      - app-internal
    depends_on:
      - main-backend
    restart: unless-stopped

