worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide Nginx version from response headers (security hardening)
    server_tokens off;

    # Security headers applied globally
    add_header X-Frame-Options       "SAMEORIGIN"          always;
    add_header X-Content-Type-Options "nosniff"            always;
    add_header X-XSS-Protection      "1; mode=block"       always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

    # Gzip — reduces payload size for API JSON responses and JS bundles
    gzip on;
    gzip_vary on;
    gzip_types text/plain application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # Rate limiting zones (stored in 10MB shared memory)
    # Protects API from abuse and brute-force on auth endpoints
    limit_req_zone $binary_remote_addr zone=api_limit:10m   rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m  rate=10r/m;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        # ── Static Frontend ─────────────────────────────────────
        location / {
            proxy_pass         http://client:80;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Auth endpoints — stricter rate limit ─────────────────
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass         http://service-router:5003;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── All other API routes ─────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass         http://service-router:5003;
            proxy_http_version 1.1;
            proxy_read_timeout 120s;   # AI requests can take longer
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
